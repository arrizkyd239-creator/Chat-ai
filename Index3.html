
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI CHAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07152d;color:white;font-family:Arial;height:100dvh;display:flex;flex-direction:column}
header{padding:16px;background:#10294d;display:flex;align-items:center;gap:12px}
.logo{background:#168bff;padding:13px;border-radius:13px;font-size:25px}
.sub{color:#9db1cc;font-size:12px;margin-top:4px}
#status{margin-left:auto;color:#8ee8bd;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:18px}
.welcome{text-align:center;margin:65px auto}
.welcome h2{font-size:25px}
.welcome p{color:#9db1cc}
.msg{display:flex;gap:11px;margin-bottom:24px;line-height:1.7}
.avatar{width:34px;height:34px;flex-shrink:0;background:#168bff;border-radius:11px;display:grid;place-items:center}
.user .avatar{background:#17365e}
.name{font-size:12px;color:#91a9c7;margin-bottom:5px}
.content{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:12px;background:#07152d;border-top:1px solid #29476c}
.inputbox{display:flex;gap:8px;background:#10294d;padding:9px;border:1px solid #355477;border-radius:18px}
textarea{flex:1;resize:none;min-height:43px;max-height:120px;background:transparent;color:white;border:0;outline:0;font-size:16px;padding:10px}
button{background:#168bff;color:white;border:0;border-radius:13px;padding:12px 17px;font-size:20px}
button:disabled{opacity:.5}
small{display:block;text-align:center;color:#8299b8;padding:8px}
</style>
</head>
<body>

<header>
 <div class="logo">✦</div>
 <div>
  <b>AI CHAT</b>
  <div class="sub">Asisten Pintar</div>
 </div>
 <div id="status">● SIAP</div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h2>Ada yang bisa saya bantu?</h2>
  <p>Tanyakan apa saja kepada AI.</p>
 </div>
</main>

<div class="composer">
 <div class="inputbox">
  <textarea id="question" placeholder="Tanyakan apa saja..."></textarea>
  <button id="send">➤</button>
 </div>
 <small>AI CHAT • Tidak perlu login</small>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const send=document.getElementById("send");
const statusText=document.getElementById("status");

let history=[];
let busy=false;

function addMessage(role,text){
 const row=document.createElement("div");
 row.className="msg "+role;

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=role==="ai"?"✦":"🙂";

 const box=document.createElement("div");
 const name=document.createElement("div");
 name.className="name";
 name.textContent=role==="ai"?"AI CHAT":"KAMU";

 const content=document.createElement("div");
 content.className="content";
 content.textContent=text;

 box.append(name,content);
 row.append(avatar,box);
 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;

 return content;
}

async function sendMessage(){
 const q=input.value.trim();
 if(!q||busy)return;

 document.getElementById("welcome")?.remove();

 addMessage("user",q);
 input.value="";
 input.style.height="43px";

 history.push({role:"user",content:q});

 busy=true;
 send.disabled=true;
 statusText.textContent="● BERPIKIR";

 const loading=addMessage("ai","Sedang berpikir...");

 try{
  const response=await fetch("/.netlify/functions/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    messages:history.slice(-12)
   })
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"Server AI bermasalah.");
  }

  if(!data.reply){
   throw new Error("Jawaban AI kosong.");
  }

  loading.textContent=data.reply;

  history.push({
   role:"assistant",
   content:data.reply
  });

  statusText.textContent="● ONLINE";

 }catch(error){
  loading.textContent=
   "Gagal: "+error.message+
   "\n\nPeriksa apakah Netlify sudah selesai deploy.";

  history.pop();
  statusText.textContent="● GAGAL";
 }

 busy=false;
 send.disabled=false;
 input.focus();
}

send.onclick=sendMessage;

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",()=>{
 input.style.height="43px";
 input.style.height=Math.min(input.scrollHeight,120)+"px";
});
</script>
</body>
</html>
